<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D1A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Dice Top Face -->
    <linearGradient id="diceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Dice Left Face -->
    <linearGradient id="diceLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Dice Right Face -->
    <linearGradient id="diceRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Neon Border -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="12" />

  <!-- 4 Corner Ludo Color Gems -->
  <circle cx="85" cy="85" r="24" fill="#EF4444" filter="url(#neonGlow)" />
  <circle cx="85" cy="85" r="12" fill="#FCA5A5" />

  <circle cx="427" cy="85" r="24" fill="#10B981" filter="url(#neonGlow)" />
  <circle cx="427" cy="85" r="12" fill="#6EE7B7" />

  <circle cx="85" cy="427" r="24" fill="#3B82F6" filter="url(#neonGlow)" />
  <circle cx="85" cy="427" r="12" fill="#93C5FD" />

  <circle cx="427" cy="427" r="24" fill="#F59E0B" filter="url(#neonGlow)" />
  <circle cx="427" cy="427" r="12" fill="#FDE047" />

  <!-- Center Ambient Halo Glow -->
  <circle cx="256" cy="256" r="140" fill="#22D3EE" opacity="0.18" filter="url(#neonGlow)" />

  <!-- 3D Isometric Ludo Dice in Center -->
  <!-- Top Face -->
  <polygon points="256,130 366,192 256,254 146,192" fill="url(#diceTop)" stroke="#7DD3FC" stroke-width="3" />

  <!-- Left Face -->
  <polygon points="146,192 256,254 256,374 146,312" fill="url(#diceLeft)" stroke="#38BDF8" stroke-width="3" />

  <!-- Right Face -->
  <polygon points="256,254 366,192 366,312 256,374" fill="url(#diceRight)" stroke="#0284C7" stroke-width="3" />

  <!-- Top Face Pips (1 glowing center pip) -->
  <ellipse cx="256" cy="192" rx="16" ry="9" fill="#FFFFFF" filter="url(#neonGlow)" />

  <!-- Left Face Pips (6 dots) -->
  <ellipse cx="180" cy="235" rx="8" ry="14" fill="#FFFFFF" />
  <ellipse cx="180" cy="275" rx="8" ry="14" fill="#FFFFFF" />
  <ellipse cx="180" cy="315" rx="8" ry="14" fill="#FFFFFF" />
  <ellipse cx="222" cy="255" rx="8" ry="14" fill="#FFFFFF" />
  <ellipse cx="222" cy="295" rx="8" ry="14" fill="#FFFFFF" />
  <ellipse cx="222" cy="335" rx="8" ry="14" fill="#FFFFFF" />

  <!-- Right Face Pips (4 dots) -->
  <ellipse cx="290" cy="255" rx="8" ry="14" fill="#FFFFFF" />
  <ellipse cx="290" cy="335" rx="8" ry="14" fill="#FFFFFF" />
  <ellipse cx="332" cy="235" rx="8" ry="14" fill="#FFFFFF" />
  <ellipse cx="332" cy="315" rx="8" ry="14" fill="#FFFFFF" />

  <!-- Golden Crown Apex -->
  <polygon points="220,135 238,108 256,125 274,108 292,135" fill="#FBBF24" stroke="#F59E0B" stroke-width="2" filter="url(#neonGlow)" />
  <circle cx="238" cy="106" r="4" fill="#FDE047" />
  <circle cx="256" cy="123" r="4" fill="#FDE047" />
  <circle cx="274" cy="106" r="4" fill="#FDE047" />
</svg>
